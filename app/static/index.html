<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Fact-Checker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230284c7'/%3E%3Cpath d='M8 17l5 5 11-12' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before first paint to avoid a flash; storage may be unavailable.
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Agentic YouTube Fact-Checker</h1>
        <p class="lede">
          Paste a video link. The agent audits its claims against web evidence and community discussion,
          flags sponsorships, and summarizes what the video teaches. Reports are saved, so a video you already
          checked opens instantly.
        </p>
      </div>
      <div class="header-actions">
        <button type="button" id="theme-toggle" class="icon-btn" aria-label="Toggle light/dark theme" title="Toggle theme">◐</button>
      </div>
    </header>

    <form id="analyze-form">
      <label for="video_url" class="sr-only">YouTube URL</label>
      <input id="video_url" name="video_url" type="url" required maxlength="300"
             placeholder="https://www.youtube.com/watch?v=...">
      <button type="submit" id="submit-btn" class="primary">Analyze</button>
    </form>

    <section id="run" hidden>
      <div id="video-card" class="video-card" hidden>
        <div class="video-title"></div>
        <div class="video-meta"></div>
      </div>

      <details id="activity" class="activity" open>
        <summary>
          <span class="activity-title">Agent activity</span>
          <span id="activity-meta" class="activity-meta"></span>
        </summary>
        <div class="tabs" role="tablist" aria-label="Activity views">
          <button type="button" role="tab" id="tab-steps" class="tab active" aria-selected="true" aria-controls="timeline">Steps</button>
          <button type="button" role="tab" id="tab-trace" class="tab" aria-selected="false" aria-controls="trace">Developer trace</button>
          <button type="button" id="trace-copy" class="tab-action" hidden>Copy trace</button>
        </div>
        <ol id="timeline" class="timeline" role="tabpanel" aria-labelledby="tab-steps" aria-live="polite"></ol>
        <div id="trace" class="trace" role="tabpanel" aria-labelledby="tab-trace" hidden></div>
      </details>

      <section id="findings" class="findings" hidden>
        <h2>Findings so far</h2>
        <div id="summary-live"></div>
        <div id="overview"></div>
        <div id="claims-live" class="claims"></div>
        <div id="comments-live"></div>
      </section>

      <div id="error" class="error" role="alert" hidden></div>

      <div id="report-toolbar" class="report-toolbar" hidden>
        <span id="report-status"></span>
        <button type="button" id="rerun-btn" class="secondary">Re-run analysis</button>
      </div>
      <div id="report" aria-live="polite"></div>
    </section>
  </main>

  <script>
    (function () {
      var NODE_LABELS = {
        triage: "Getting to know the video",
        extraction: "Reading the transcript & comments",
        investigator: "Investigating the claims",
        critic: "Double-checking weak spots",
        report: "Scoring and writing the report"
      };
      var VERDICT_CLASS = {
        "Verified": "good", "Mostly True": "good", "Exaggerated": "warn",
        "Partially False": "warn", "Debunked": "bad", "Unverified": "none"
      };
      var $ = function (id) { return document.getElementById(id); };
      var source = null, timer = null, startedAt = 0, stepCount = 0, currentUrl = "";
      var steps = {}, claimEls = {}, currentGroup = null, userScrolled = false, traceLines = [];

      function el(tag, cls, text) {
        var node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text !== undefined && text !== null) node.textContent = text;
        return node;
      }

      function reset() {
        if (source) source.close();
        clearInterval(timer);
        steps = {}; claimEls = {}; currentGroup = null; stepCount = 0; userScrolled = false; traceLines = [];
        $("timeline").textContent = "";
        $("trace").textContent = "";
        $("summary-live").textContent = "";
        $("overview").textContent = "";
        $("claims-live").textContent = "";
        $("comments-live").textContent = "";
        $("report").textContent = "";
        $("activity-meta").textContent = "";
        delete $("activity-meta").dataset.rid;
        $("error").hidden = true;
        $("findings").hidden = true;
        $("video-card").hidden = true;
        $("report-toolbar").hidden = true;
        $("activity").hidden = false;
        $("activity").open = true;
        $("run").hidden = false;
      }

      function tick() {
        var secs = Math.round((Date.now() - startedAt) / 1000);
        var rid = $("activity-meta").dataset.rid;
        $("activity-meta").textContent = stepCount + " steps · " + secs + "s" + (rid ? " · req " + rid : "");
      }

      function follow() {
        if (!userScrolled) window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      }

      /* ---------- Steps tab ---------- */
      function addTimelineItem(item) {
        (currentGroup || $("timeline")).appendChild(item);
        follow();
      }

      function onNodeStart(e) {
        var label = NODE_LABELS[e.node] || e.node;
        if (e.node === "investigator" && e.attempt) label += " (retry " + e.attempt + ")";
        var li = el("li", "group");
        li.appendChild(el("div", "group-title", label));
        currentGroup = el("ol", "group-steps");
        li.appendChild(currentGroup);
        $("timeline").appendChild(li);
        follow();
      }

      function onToolStart(e) {
        stepCount++;
        var li = el("li", "step running" + (e.tool === "thinking" ? " thinking" : ""));
        li.appendChild(el("span", "marker"));
        var body = el("div", "step-body");
        body.appendChild(el("div", "step-title", e.title || e.tool));
        if (e.detail) body.appendChild(el("div", "step-detail", e.detail));
        li.appendChild(body);
        steps[e.id] = { li: li, body: body };
        addTimelineItem(li);
      }

      function onToolEnd(e) {
        var s = steps[e.id];
        if (!s) return;
        s.li.classList.remove("running");
        s.li.classList.add(e.ok ? "ok" : "failed");
        s.li.querySelector(".marker").textContent = e.ok ? "✓" : "!";
        if (e.summary) s.body.appendChild(el("div", "step-result", e.summary));
      }

      function onNote(e) {
        addTimelineItem(el("li", "note", e.text));
      }

      function onVideo(e) {
        showVideo(e.title, e.channel + (e.upload_date ? " · " + e.upload_date : ""));
      }

      function showVideo(title, meta) {
        var card = $("video-card");
        card.querySelector(".video-title").textContent = title || "";
        card.querySelector(".video-meta").textContent = meta || "";
        card.hidden = !title;
      }

      /* ---------- Developer trace tab ---------- */
      function fmtVal(v) {
        return typeof v === "string" ? JSON.stringify(v.length > 160 ? v.slice(0, 160) + "…" : v) : JSON.stringify(v);
      }

      function fmtArgs(args) {
        if (args && typeof args === "object") {
          return Object.keys(args).map(function (k) { return k + "=" + fmtVal(args[k]); }).join(", ");
        }
        return args ? String(args) : "";
      }

      function pretty(v) {
        if (typeof v === "string") { try { return JSON.stringify(JSON.parse(v), null, 2); } catch (e) { return v; } }
        return JSON.stringify(v, null, 2);
      }

      function describeTrace(r) {
        var ms = function (n) { return n === undefined || n === null ? "" : " (" + n + "ms)"; };
        switch (r.event) {
          case "request_start": return { cls: "node", text: "request started  video_url=" + fmtVal(r.video_url) };
          case "tool_call_start": return { cls: "call", text: "→ CALL  " + r.tool + "(" + fmtArgs(r.args) + ")" };
          case "tool_call":
            return {
              cls: r.ok ? "ret" : "fail",
              text: "← " + (r.ok ? "RETURN" : "FAILED") + "  " + r.tool + ms(r.duration_ms) + "  " + (r.summary || ""),
              detail: [["arguments", pretty(r.args)], ["result", pretty(r.result)], r.error ? ["error", r.error] : null]
            };
          case "llm_call_start":
            return { cls: "llm", text: "→ LLM   " + r.purpose + "  model=" + r.model + (r.input_chars ? "  input_chars=" + r.input_chars : "") };
          case "llm_call":
            return {
              cls: r.ok ? "llm" : "fail",
              text: "← LLM   " + (r.ok ? "done" : "FAILED") + ms(r.duration_ms) + "  " + (r.summary || r.purpose),
              detail: [r.output ? ["structured output", pretty(r.output)] : null, r.prompt ? ["prompt", r.prompt] : null, r.error ? ["error", r.error] : null]
            };
          case "llm_turn_start":
            return { cls: "llm", text: "→ LLM   tool-use round " + r.round + "  model=" + r.model + "  messages=" + r.messages };
          case "llm_turn":
            var calls = (r.tool_calls || []).map(function (c) { return c.name + "(" + fmtArgs(c.args) + ")"; });
            return {
              cls: "llm",
              text: "← LLM   round " + r.round + " decided: " + (calls.length ? calls.join("; ") : "no more tools"),
              detail: [r.text ? ["model's stated reasoning", r.text] : null]
            };
          case "verdict": return { cls: "ret", text: "VERDICT  " + r.verdict + " (" + r.confidence + ")  " + r.claim, detail: [["sources", (r.sources || []).join("\n")]] };
          case "node_end": return { cls: "node", text: "node finished: " + r.node + "  state_keys=" + (r.state_keys || []).join(",") };
          case "progress":
            if (r.type === "node_start") return { cls: "node", text: "node starting: " + r.node + (r.attempt ? "  attempt=" + r.attempt : "") };
            if (r.type === "note") return { cls: "note", text: "note: " + r.text };
            return { cls: "node", text: "event: " + r.type };
          case "report_stored": return { cls: "node", text: "report stored for reuse" };
          case "request_end": return { cls: r.status === "ok" ? "ret" : "fail", text: "request finished  status=" + r.status + "  score=" + r.score + "  saved_to_memory=" + r.saved_to_memory + ms(r.duration_ms) };
          case "request_error": return { cls: "fail", text: "request FAILED", detail: [["error", r.error]] };
          case "request_cancelled": return { cls: "fail", text: "request cancelled: " + r.reason };
          default: return { cls: "node", text: r.event };
        }
      }

      function onTrace(e) {
        var r = e.record, d = describeTrace(r);
        var time = (r.t_ms / 1000).toFixed(2).padStart(7) + "s  ";
        traceLines.push(time + d.text);
        var details = (d.detail || []).filter(Boolean);
        var line = el(details.length ? "details" : "div", "trace-line trace-" + d.cls);
        var head = el(details.length ? "summary" : "div", "trace-head");
        head.appendChild(el("span", "trace-time", time));
        head.appendChild(el("span", "trace-text", d.text));
        line.appendChild(head);
        details.forEach(function (pair) {
          line.appendChild(el("div", "trace-label", pair[0]));
          line.appendChild(el("pre", "trace-pre", pair[1]));
          traceLines.push("            " + pair[0] + ": " + pair[1].replace(/\n/g, "\n            "));
        });
        var box = $("trace");
        var pinned = box.scrollTop + box.clientHeight >= box.scrollHeight - 24;
        box.appendChild(line);
        if (pinned) box.scrollTop = box.scrollHeight;
      }

      function selectTab(name) {
        var trace = name === "trace";
        $("tab-steps").classList.toggle("active", !trace);
        $("tab-trace").classList.toggle("active", trace);
        $("tab-steps").setAttribute("aria-selected", String(!trace));
        $("tab-trace").setAttribute("aria-selected", String(trace));
        $("timeline").hidden = trace;
        $("trace").hidden = !trace;
        $("trace-copy").hidden = !trace;
      }

      /* ---------- Findings ---------- */
      function showFindings() { $("findings").hidden = false; }

      function onOverview(e) {
        showFindings();
        var box = $("overview");
        box.textContent = "";
        var card = el("div", "overview-card");
        var head = el("div", "overview-head");
        head.appendChild(el("span", "chip", "Clickbait: " + e.clickbait.clickbait_rating));
        if (e.domain) head.appendChild(el("span", "chip muted", e.domain));
        if (e.has_paid_promotion) head.appendChild(el("span", "chip warn", "Paid promotion" + (e.sponsors.length ? ": " + e.sponsors.join(", ") : "")));
        card.appendChild(head);
        card.appendChild(el("p", "overview-verdict", e.clickbait.verdict));
        if (e.clickbait.payoff_timestamp) card.appendChild(el("p", "meta", "The answer comes at " + e.clickbait.payoff_timestamp));
        if (e.bias_notes) card.appendChild(el("p", "meta", "Bias note: " + e.bias_notes));
        box.appendChild(card);
      }

      function claimCard(claim) {
        var d = el("div", "claim claim-none pending");
        var row = el("div", "claim-row");
        row.appendChild(el("span", "verdict verdict-none", "Checking…"));
        row.appendChild(el("span", "claim-text", claim.claim));
        d.appendChild(row);
        d.appendChild(el("div", "claim-meta", "at " + (claim.timestamp || "?")));
        return d;
      }

      function onClaims(e) {
        showFindings();
        e.claims.forEach(function (c) {
          var card = claimCard(c);
          claimEls[c.claim] = card;
          $("claims-live").appendChild(card);
        });
      }

      function onVerdict(e) {
        var r = e.result, card = claimEls[r.claim];
        if (!card) { card = claimCard(r); claimEls[r.claim] = card; $("claims-live").appendChild(card); }
        var cls = VERDICT_CLASS[r.verdict] || "none";
        card.className = "claim claim-" + cls + " revealed";
        card.textContent = "";
        var row = el("div", "claim-row");
        row.appendChild(el("span", "verdict verdict-" + cls, r.verdict));
        row.appendChild(el("span", "claim-text", r.claim));
        card.appendChild(row);
        card.appendChild(el("p", "claim-evidence", r.evidence));
        card.appendChild(el("div", "claim-meta", "at " + r.timestamp + " · confidence: " + r.confidence));
      }

      function onSummary(e) {
        showFindings();
        var box = $("summary-live");
        box.textContent = "";
        var card = el("div", "overview-card");
        var head = el("div", "overview-head");
        head.appendChild(el("span", "chip", e.video_type));
        head.appendChild(el("span", "chip muted", e.key_points.length + " key ideas"));
        card.appendChild(head);
        card.appendChild(el("p", "overview-verdict", e.tldr));
        var list = el("ul", "live-points");
        e.key_points.forEach(function (kp) { list.appendChild(el("li", null, "[" + kp.timestamp + "] " + kp.point)); });
        card.appendChild(list);
        box.appendChild(card);
      }

      function onComments(e) {
        showFindings();
        var box = $("comments-live");
        box.textContent = "";
        box.appendChild(el("h3", "live-h", "New information from the comments"));
        var list = el("ul", "live-points");
        e.insights.forEach(function (c) { list.appendChild(el("li", null, c.category + ": " + c.detail + " (" + c.author + ")")); });
        box.appendChild(list);
      }

      function onRequest(e) {
        $("activity").querySelector(".activity-title").title = "Debug log: logs/" + e.log_file;
        $("activity-meta").dataset.rid = e.id;
      }

      var HANDLERS = {
        request: onRequest, node_start: onNodeStart, tool_start: onToolStart, tool_end: onToolEnd, note: onNote,
        video: onVideo, overview: onOverview, claims: onClaims, verdict: onVerdict, trace: onTrace,
        summary: onSummary, comments: onComments
      };

      /* ---------- Saved report banner ---------- */
      function ago(iso) {
        var secs = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
        if (isNaN(secs)) return "earlier";
        if (secs < 90) return "just now";
        if (secs < 5400) return Math.round(secs / 60) + " min ago";
        if (secs < 129600) return Math.round(secs / 3600) + " h ago";
        return Math.round(secs / 86400) + " days ago";
      }

      function showToolbar(text, label) {
        $("report-status").textContent = text;
        $("rerun-btn").textContent = label || "Re-run analysis";
        $("report-toolbar").hidden = false;
      }

      function finish() {
        clearInterval(timer);
        tick();
        if (source) source.close();
        source = null;
        $("submit-btn").disabled = false;
        $("rerun-btn").disabled = false;
        document.querySelectorAll(".step.running").forEach(function (s) { s.classList.remove("running"); });
      }

      /* ---------- Run ---------- */
      function start(url, refresh) {
        currentUrl = url;
        reset();
        selectTab("steps");
        $("submit-btn").disabled = true;
        $("rerun-btn").disabled = true;
        startedAt = Date.now();
        timer = setInterval(tick, 1000);
        source = new EventSource("/api/analyze/stream?video_url=" + encodeURIComponent(url) + (refresh ? "&refresh=true" : ""));

        source.addEventListener("agent", function (m) {
          var e = JSON.parse(m.data);
          var h = HANDLERS[e.type];
          if (h) h(e);
        });
        source.addEventListener("cached", function (m) {
          var c = JSON.parse(m.data);
          clearInterval(timer);
          $("activity").hidden = true; // nothing ran, so there is no activity to show
          if (c.video && c.video.title) showVideo(c.video.title, c.video.channel || "");
          showToolbar("Saved report · generated " + ago(c.generated_at), "Re-run analysis");
        });
        source.addEventListener("report", function (m) {
          $("report").innerHTML = m.data; // server-sanitized HTML (raw HTML in model output is escaped)
          $("findings").hidden = true;
          if (!$("activity").hidden) $("activity").open = false;
          var aborted = !!$("report").querySelector("[data-aborted]");
          if ($("report-toolbar").hidden) showToolbar(aborted ? "The analysis did not complete." : "Report generated just now.", aborted ? "Try again" : "Re-run analysis");
          $("report").scrollIntoView({ behavior: "smooth", block: "start" });
        });
        source.addEventListener("error", function (m) {
          // A native connection error has no data; close at once so EventSource never auto-reconnects and re-runs the analysis.
          if (!source) return;
          $("error").textContent = m.data || "Connection to the server was lost before the analysis finished.";
          $("error").hidden = false;
          finish();
        });
        source.addEventListener("done", finish);
      }

      $("analyze-form").addEventListener("submit", function (ev) {
        ev.preventDefault();
        var url = $("video_url").value.trim();
        if (url) start(url, false);
      });
      $("rerun-btn").addEventListener("click", function () { if (currentUrl) start(currentUrl, true); });

      $("tab-steps").addEventListener("click", function () { selectTab("steps"); });
      $("tab-trace").addEventListener("click", function () { selectTab("trace"); });
      $("trace-copy").addEventListener("click", function () {
        var btn = $("trace-copy"), text = traceLines.join("\n");
        var done = function (ok) { btn.textContent = ok ? "Copied" : "Copy failed"; setTimeout(function () { btn.textContent = "Copy trace"; }, 1500); };
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
        else done(false);
      });

      window.addEventListener("wheel", function (e) { if (e.deltaY < 0) userScrolled = true; }, { passive: true });

      $("theme-toggle").addEventListener("click", function () {
        var root = document.documentElement;
        var current = root.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        var next = current === "light" ? "dark" : "light";
        root.dataset.theme = next;
        try { localStorage.setItem("theme", next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
