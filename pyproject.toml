[project]
name = "agentic-youtube-analyzer"
version = "0.1.0"
description = "Agentic YouTube analyzer and fact-checking platform"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "youtube-transcript-api>=1.0",
    "google-api-python-client>=2.100",
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-mcp-adapters>=0.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["mcp-servers/youtube", "scripts", "."]
testpaths = ["tests"]
